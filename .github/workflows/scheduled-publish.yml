name: Scheduled publish

# 예약된 글(status:"scheduled")을 정해진 시각에 발행 상태로 바꾸고 커밋합니다.
# 푸시되면 Vercel이 자동으로 배포합니다.
on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
    - cron: "0 9 * * *"  # 18:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish due posts
        run: node scripts/publish-due-posts.mjs

      - name: Commit and push if content changed
        id: commit
        run: |
          if git diff --quiet -- lib/content.ts; then
            echo "발행할 예약 글이 없습니다."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/content.ts
          git commit -m "chore: publish due scheduled posts"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 푸시는 indexnow.yml을 트리거하지 않으므로 여기서 직접 호출한다.
      # 실제로 발행 커밋이 생겼을 때만 제출한다 (같은 URL 반복 제출 방지).
      - name: Ping IndexNow for newly published posts
        if: steps.commit.outputs.published == 'true'
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/ping-indexnow.mjs --base HEAD~1 --head HEAD

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="실업급여 대상이 아닐 때 국민취업지원제도 1유형과 2유형 중 어디로 가는지 보여주는 갈림 도표" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>국민취업지원제도 유형 갈림</title><rect width="880" height="420" fill="#f6f9f7"/>
<g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<rect x="290" y="20" width="300" height="54" rx="8" fill="#102d3c"/>
<text x="440" y="43" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">실업급여 대상이 아니거나</text>
<text x="440" y="63" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">수급이 끝났다</text>
<path d="M440 74 L440 100 M180 100 L700 100 M180 100 L180 128 M700 100 L700 128" stroke="#2e6573" stroke-width="2" fill="none"/>
<path d="M174 122 L180 132 L186 122 Z" fill="#2e6573"/><path d="M694 122 L700 132 L706 122 Z" fill="#2e6573"/>

<rect x="40" y="136" width="280" height="180" rx="8" fill="#ffffff" stroke="#2e6573" stroke-width="2"/>
<rect x="40" y="136" width="280" height="42" rx="8" fill="#2e6573"/><rect x="40" y="160" width="280" height="18" fill="#2e6573"/>
<text x="180" y="165" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">1유형</text>
<text x="62" y="204" font-size="13.5" fill="#18313c">15~69세</text>
<text x="62" y="230" font-size="13.5" fill="#18313c">중위소득 60% 이하</text>
<text x="62" y="256" font-size="13.5" fill="#18313c">재산 기준 있음</text>
<text x="62" y="282" font-size="13.5" fill="#18313c">최근 2년 취업경험 요건</text>
<rect x="40" y="330" width="280" height="52" rx="8" fill="#eaf2ee"/>
<text x="180" y="352" text-anchor="middle" font-size="14" font-weight="800" fill="#2e6573">구직촉진수당 + 취업지원</text>
<text x="180" y="372" text-anchor="middle" font-size="12.5" fill="#3d5560">현금 지원이 6개월간 나옵니다</text>

<rect x="560" y="136" width="280" height="180" rx="8" fill="#ffffff" stroke="#cddbd6" stroke-width="2"/>
<rect x="560" y="136" width="280" height="42" rx="8" fill="#3f7d86"/><rect x="560" y="160" width="280" height="18" fill="#3f7d86"/>
<text x="700" y="165" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">2유형</text>
<text x="582" y="204" font-size="13.5" font-weight="800" fill="#b45309">중장년은 여기입니다</text>
<text x="582" y="230" font-size="13.5" fill="#18313c">35~69세</text>
<text x="582" y="256" font-size="13.5" fill="#18313c">중위소득 100% 이하</text>
<text x="582" y="282" font-size="13.5" fill="#18313c">1유형 요건에서 밀린 경우</text>
<rect x="560" y="330" width="280" height="52" rx="8" fill="#f6f9f7" stroke="#cddbd6" stroke-width="2"/>
<text x="700" y="352" text-anchor="middle" font-size="14" font-weight="800" fill="#102d3c">취업활동비용 + 훈련·알선</text>
<text x="700" y="372" text-anchor="middle" font-size="12.5" fill="#3d5560">현금보다 훈련 지원이 중심</text>

<rect x="340" y="196" width="200" height="96" rx="8" fill="#fff7f0" stroke="#e67b32" stroke-width="2"/>
<text x="440" y="226" text-anchor="middle" font-size="13.5" font-weight="800" fill="#b45309">유형은 내가 고르지</text>
<text x="440" y="248" text-anchor="middle" font-size="13.5" font-weight="800" fill="#b45309">않습니다</text>
<text x="440" y="274" text-anchor="middle" font-size="12.5" fill="#3d5560">신청하면 심사에서 정해집니다</text>
<text x="440" y="410" text-anchor="middle" font-size="13" fill="#71868d">지원 금액과 세부 요건은 해마다 조정되므로 신청 전 고용24에서 확인하세요.</text>

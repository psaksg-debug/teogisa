<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="근로장려금 반기신청 신청부터 정산까지의 일정">
  <title>근로장려금 반기신청 일정</title>
  <rect width="880" height="320" fill="#ffffff"/>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">

    <path d="M117 56 L763 56" stroke="#cddbd6" stroke-width="2"/>
    <circle cx="117" cy="56" r="9" fill="#e67b32"/>
    <circle cx="332" cy="56" r="7" fill="#2e6573"/>
    <circle cx="548" cy="56" r="7" fill="#2e6573"/>
    <circle cx="763" cy="56" r="7" fill="#102d3c"/>

    <rect x="25" y="86" width="185" height="176" rx="8" fill="#fff7f0" stroke="#e67b32" stroke-width="2"/>
    <rect x="25" y="86" width="185" height="30" rx="8" fill="#e67b32"/>
    <rect x="25" y="106" width="185" height="10" fill="#e67b32"/>
    <text x="117" y="107" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">지금 이 단계</text>
    <text x="117" y="146" text-anchor="middle" font-size="15" font-weight="800" fill="#b45309">2026.9.1 ~ 9.15</text>
    <text x="117" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#102d3c">상반기분 신청</text>
    <text x="117" y="206" text-anchor="middle" font-size="13" fill="#18313c">안내문을 받았다면</text>
    <text x="117" y="226" text-anchor="middle" font-size="13" fill="#18313c">ARS·손택스로 몇 분,</text>
    <text x="117" y="246" text-anchor="middle" font-size="13" fill="#18313c">아니면 홈택스에서 신청</text>

    <rect x="240" y="86" width="185" height="176" rx="8" fill="#f6f9f7" stroke="#cddbd6" stroke-width="2"/>
    <text x="332" y="122" text-anchor="middle" font-size="15" font-weight="800" fill="#2e6573">2026년 12월</text>
    <text x="332" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#102d3c">35% 먼저 지급</text>
    <text x="332" y="182" text-anchor="middle" font-size="13" fill="#18313c">연간 산정액의 35%가</text>
    <text x="332" y="202" text-anchor="middle" font-size="13" fill="#18313c">계좌로 먼저 들어옵니다.</text>
    <text x="332" y="230" text-anchor="middle" font-size="13" fill="#18313c">확정액이 아니라</text>
    <text x="332" y="250" text-anchor="middle" font-size="13" fill="#18313c">추정액 기준입니다.</text>

    <rect x="455" y="86" width="185" height="176" rx="8" fill="#f6f9f7" stroke="#cddbd6" stroke-width="2"/>
    <text x="548" y="122" text-anchor="middle" font-size="15" font-weight="800" fill="#2e6573">2027.3.1 ~ 3.15</text>
    <text x="548" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#102d3c">하반기분 신청</text>
    <text x="548" y="182" text-anchor="middle" font-size="13" fill="#18313c">7~12월 근로소득으로</text>
    <text x="548" y="202" text-anchor="middle" font-size="13" fill="#18313c">한 번 더 신청합니다.</text>
    <text x="548" y="230" text-anchor="middle" font-size="13" fill="#18313c">이때도 근로소득만</text>
    <text x="548" y="250" text-anchor="middle" font-size="13" fill="#18313c">있어야 대상입니다.</text>

    <rect x="670" y="86" width="185" height="176" rx="8" fill="#eaf2ee" stroke="#102d3c" stroke-width="2"/>
    <text x="763" y="122" text-anchor="middle" font-size="15" font-weight="800" fill="#2e6573">2027년 6월</text>
    <text x="763" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#102d3c">정산</text>
    <text x="763" y="182" text-anchor="middle" font-size="13" fill="#18313c">확정 소득으로 다시 계산해</text>
    <text x="763" y="202" text-anchor="middle" font-size="13" fill="#18313c">모자라면 추가 지급,</text>
    <text x="763" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">더 받았으면 환수합니다.</text>
    <text x="763" y="250" text-anchor="middle" font-size="13" fill="#18313c">자녀장려금도 이때 함께</text>

    <text x="440" y="298" text-anchor="middle" font-size="13" fill="#71868d">반기신청을 하면 2027년 5월 정기신청은 따로 하지 않습니다. 정확한 지급일은 국세청 안내로 확인하세요.</text>
  </g>
</svg>

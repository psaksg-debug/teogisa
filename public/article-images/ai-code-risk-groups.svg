<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="AI가 만든 코드를 그대로 배포할 때 생기는 위험을 요금, 데이터, 권한 세 갈래로 묶은 도표" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AI 코드 배포 위험 세 갈래</title><rect width="880" height="400" fill="#ffffff"/>
<g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<text x="60" y="42" font-size="16" font-weight="800" fill="#102d3c">여덟 가지 사고는 결국 세 갈래에서 나옵니다</text>

<rect x="60" y="64" width="246" height="230" rx="8" fill="#fff7f0" stroke="#e67b32" stroke-width="2"/>
<rect x="60" y="64" width="246" height="40" rx="8" fill="#e67b32"/><rect x="60" y="88" width="246" height="16" fill="#e67b32"/>
<text x="183" y="92" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">돈이 샌다</text>
<text x="82" y="136" font-size="13.5" fill="#18313c">· 자동 충전 한도를 안 걸었다</text>
<text x="82" y="164" font-size="13.5" fill="#18313c">· 에이전트가 스스로 늘어난다</text>
<text x="82" y="192" font-size="13.5" fill="#18313c">· 호출 루프를 못 끊는다</text>
<rect x="82" y="214" width="202" height="60" rx="6" fill="#ffffff"/>
<text x="183" y="238" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">먼저 할 것</text>
<text x="183" y="260" text-anchor="middle" font-size="12.5" fill="#3d5560">결제 한도부터 잠근다</text>

<rect x="317" y="64" width="246" height="230" rx="8" fill="#f6f9f7" stroke="#2e6573" stroke-width="2"/>
<rect x="317" y="64" width="246" height="40" rx="8" fill="#2e6573"/><rect x="317" y="88" width="246" height="16" fill="#2e6573"/>
<text x="440" y="92" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">데이터가 사라진다</text>
<text x="339" y="136" font-size="13.5" fill="#18313c">· 확인 없이 전부 승인했다</text>
<text x="339" y="164" font-size="13.5" fill="#18313c">· 백업이 원본과 같은 곳에 있다</text>
<text x="339" y="192" font-size="13.5" fill="#18313c">· 되돌릴 지점을 안 만들었다</text>
<rect x="339" y="214" width="202" height="60" rx="6" fill="#ffffff"/>
<text x="440" y="238" text-anchor="middle" font-size="13" font-weight="800" fill="#2e6573">먼저 할 것</text>
<text x="440" y="260" text-anchor="middle" font-size="12.5" fill="#3d5560">백업을 다른 곳에 둔다</text>

<rect x="574" y="64" width="246" height="230" rx="8" fill="#f6f9f7" stroke="#cddbd6" stroke-width="2"/>
<rect x="574" y="64" width="246" height="40" rx="8" fill="#102d3c"/><rect x="574" y="88" width="246" height="16" fill="#102d3c"/>
<text x="697" y="92" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">남이 들어온다</text>
<text x="596" y="136" font-size="13.5" fill="#18313c">· 마스터 키를 그대로 썼다</text>
<text x="596" y="164" font-size="13.5" fill="#18313c">· 접근 제한을 안 켰다</text>
<text x="596" y="192" font-size="13.5" fill="#18313c">· 화면 코드에 비밀키를 박았다</text>
<rect x="596" y="214" width="202" height="60" rx="6" fill="#ffffff"/>
<text x="697" y="238" text-anchor="middle" font-size="13" font-weight="800" fill="#102d3c">먼저 할 것</text>
<text x="697" y="260" text-anchor="middle" font-size="12.5" fill="#3d5560">키는 서버에만 둔다</text>

<text x="440" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#102d3c">세 갈래 모두 &#8216;돌아가는지&#8217;가 아니라 &#8216;잘못됐을 때 어디까지 번지는지&#8217;의 문제입니다.</text>
<text x="440" y="366" text-anchor="middle" font-size="13" fill="#71868d">AI는 동작하는 코드를 잘 만들고, 한도와 권한은 사람이 정합니다.</text>
</g></svg>

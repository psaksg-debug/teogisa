<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="퇴직 후 현금흐름을 생활비 방어, 경험을 파는 소득, 쌓이는 소득 세 층으로 나눈 도표" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>퇴직 후 수입의 세 층</title><rect width="880" height="400" fill="#ffffff"/>
<g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<text x="60" y="42" font-size="16" font-weight="800" fill="#102d3c">위로 갈수록 느리게 쌓이고, 아래로 갈수록 빨리 효과가 납니다</text>

<rect x="60" y="64" width="760" height="84" rx="8" fill="#eaf2ee" stroke="#2e6573" stroke-width="2"/>
<rect x="60" y="64" width="150" height="84" rx="8" fill="#2e6573"/><rect x="196" y="64" width="14" height="84" fill="#2e6573"/>
<text x="135" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3층</text>
<text x="135" y="124" text-anchor="middle" font-size="13" fill="#d8eee8">쌓이는 소득</text>
<text x="234" y="96" font-size="15" font-weight="700" fill="#102d3c">검색되는 콘텐츠, 디지털 자료, 자동화된 서비스</text>
<text x="234" y="122" font-size="13" fill="#3d5560">처음엔 거의 0원 · 6개월 이상 · 성공하면 시간이 덜 든다</text>

<rect x="60" y="160" width="760" height="84" rx="8" fill="#f6f9f7" stroke="#cddbd6" stroke-width="2"/>
<rect x="60" y="160" width="150" height="84" rx="8" fill="#3f7d86"/><rect x="196" y="160" width="14" height="84" fill="#3f7d86"/>
<text x="135" y="196" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">2층</text>
<text x="135" y="220" text-anchor="middle" font-size="13" fill="#eaf2ee">경험을 파는 소득</text>
<text x="234" y="192" font-size="15" font-weight="700" fill="#102d3c">재취업, 프로젝트, 강의, 상담</text>
<text x="234" y="218" font-size="13" fill="#3d5560">단가는 높지만 시간을 계속 넣어야 한다 · 몇 주~몇 달</text>

<rect x="60" y="256" width="760" height="84" rx="8" fill="#fff7f0" stroke="#e67b32" stroke-width="2"/>
<rect x="60" y="256" width="150" height="84" rx="8" fill="#e67b32"/><rect x="196" y="256" width="14" height="84" fill="#e67b32"/>
<text x="135" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">1층</text>
<text x="135" y="316" text-anchor="middle" font-size="13" fill="#fdece0">생활비 방어</text>
<text x="234" y="288" font-size="15" font-weight="700" fill="#102d3c">고정비 줄이기, 실업급여, 받을 수 있는 지원제도</text>
<text x="234" y="314" font-size="13" fill="#b45309">가장 빠르다 · 30만원 줄이면 30만원 번 것과 같다</text>

<text x="440" y="376" text-anchor="middle" font-size="13" fill="#71868d">1층이 버틸 시간을 만들어야 3층을 기다릴 수 있습니다. 순서를 뒤집으면 퇴직금이 먼저 마릅니다.</text>
</g></svg>

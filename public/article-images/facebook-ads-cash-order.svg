<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="클릭 부업과 광고 운영 대행에서 돈이 나가고 들어오는 순서를 비교한 도표" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>클릭 부업과 광고 운영 대행의 현금 흐름 차이</title><rect width="880" height="360" fill="#f6f9f7"/>
<g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<rect x="40" y="28" width="800" height="126" rx="8" fill="#ffffff" stroke="#cddbd6" stroke-width="2"/>
<text x="62" y="58" font-size="15" font-weight="800" fill="#71868d">사람들이 상상하는 것 · 클릭 부업</text>
<rect x="62" y="76" width="200" height="52" rx="6" fill="#eaf2ee"/><text x="162" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#2e6573">시간을 넣는다</text>
<path d="M272 102 L318 102" stroke="#cddbd6" stroke-width="3"/><path d="M312 96 L324 102 L312 108 Z" fill="#cddbd6"/>
<rect x="334" y="76" width="200" height="52" rx="6" fill="#eaf2ee"/><text x="434" y="107" text-anchor="middle" font-size="14" font-weight="700" fill="#2e6573">수익이 들어온다</text>
<text x="560" y="107" font-size="14" fill="#71868d">내 돈이 나갈 일은 없다</text>

<rect x="40" y="170" width="800" height="150" rx="8" fill="#ffffff" stroke="#e67b32" stroke-width="2"/>
<text x="62" y="200" font-size="15" font-weight="800" fill="#b45309">실제 광고 운영 대행 · 돈이 먼저 나갑니다</text>
<rect x="62" y="218" width="168" height="52" rx="6" fill="#e67b32"/><text x="146" y="243" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">광고비 선지출</text><text x="146" y="261" text-anchor="middle" font-size="12" fill="#fdece0">내 카드에서 먼저</text>
<path d="M240 244 L278 244" stroke="#e67b32" stroke-width="3"/><path d="M272 238 L284 244 L272 250 Z" fill="#e67b32"/>
<rect x="294" y="218" width="168" height="52" rx="6" fill="#f6f9f7" stroke="#cddbd6" stroke-width="2"/><text x="378" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#102d3c">성과가 나올 수도</text><text x="378" y="261" text-anchor="middle" font-size="12" fill="#3d5560">안 나올 수도 있다</text>
<path d="M472 244 L510 244" stroke="#cddbd6" stroke-width="3"/><path d="M504 238 L516 244 L504 250 Z" fill="#cddbd6"/>
<rect x="526" y="218" width="168" height="52" rx="6" fill="#f6f9f7" stroke="#cddbd6" stroke-width="2"/><text x="610" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#102d3c">정산은 나중에</text><text x="610" y="261" text-anchor="middle" font-size="12" fill="#3d5560">한 달 뒤가 흔하다</text>
<rect x="706" y="218" width="112" height="52" rx="6" fill="#102d3c"/><text x="762" y="243" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">성과가 없어도</text><text x="762" y="261" text-anchor="middle" font-size="13" font-weight="800" fill="#a9d3cb">광고비는 나감</text>
<text x="62" y="300" font-size="13" fill="#3d5560">그래서 시작 전에 정할 것은 목표 수익이 아니라 <tspan font-weight="800" fill="#b45309">한 달에 잃어도 되는 광고비 상한</tspan>입니다.</text>
</g></svg>

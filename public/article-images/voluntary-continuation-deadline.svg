<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="퇴직 후 임의계속가입 신청 기한이 최초 지역보험료 납부기한에서 두 달 뒤에 닫힌다는 것을 보여주는 일정표" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>임의계속가입 신청 기한</title><rect width="880" height="380" fill="#ffffff"/>
<g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<rect x="60" y="26" width="760" height="52" rx="8" fill="#eaf2ee" stroke="#2e6573" stroke-width="2"/>
<text x="82" y="58" font-size="14.5" font-weight="700" fill="#102d3c">먼저 자격: 퇴직 전 18개월 동안 직장가입자로 통산 1년 이상 있었어야 합니다</text>

<path d="M110 150 L790 150" stroke="#cddbd6" stroke-width="3"/>
<circle cx="110" cy="150" r="9" fill="#102d3c"/><circle cx="337" cy="150" r="9" fill="#2e6573"/><circle cx="564" cy="150" r="11" fill="#e67b32"/><circle cx="790" cy="150" r="9" fill="#cddbd6"/>

<text x="110" y="128" text-anchor="middle" font-size="13" font-weight="800" fill="#102d3c">퇴직</text>
<text x="337" y="128" text-anchor="middle" font-size="13" font-weight="800" fill="#2e6573">첫 지역보험료 고지</text>
<text x="564" y="122" text-anchor="middle" font-size="14" font-weight="800" fill="#b45309">납부기한 + 2개월</text>
<text x="790" y="128" text-anchor="middle" font-size="13" font-weight="800" fill="#71868d">최대 36개월</text>

<rect x="40" y="176" width="200" height="76" rx="8" fill="#f6f9f7" stroke="#cddbd6" stroke-width="2"/>
<text x="140" y="204" text-anchor="middle" font-size="13.5" fill="#18313c">지역가입자로</text><text x="140" y="226" text-anchor="middle" font-size="13.5" fill="#18313c">자동 전환됩니다</text>
<text x="140" y="244" text-anchor="middle" font-size="12" fill="#71868d">아무것도 안 해도 바뀜</text>

<rect x="248" y="176" width="200" height="76" rx="8" fill="#f6f9f7" stroke="#cddbd6" stroke-width="2"/>
<text x="348" y="204" text-anchor="middle" font-size="13.5" fill="#18313c">여기서 금액을 보고</text><text x="348" y="226" text-anchor="middle" font-size="13.5" fill="#18313c">놀라는 분이 많습니다</text>
<text x="348" y="244" text-anchor="middle" font-size="12" fill="#71868d">재산·자동차까지 반영</text>

<rect x="456" y="176" width="216" height="76" rx="8" fill="#e67b32"/>
<text x="564" y="204" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">여기가 신청 마감</text>
<text x="564" y="228" text-anchor="middle" font-size="13" fill="#fdece0">하루만 넘겨도 신청 불가</text>
<text x="564" y="246" text-anchor="middle" font-size="12" fill="#fdece0">되돌릴 방법이 없습니다</text>

<rect x="680" y="176" width="180" height="76" rx="8" fill="#f6f9f7" stroke="#cddbd6" stroke-width="2"/>
<text x="770" y="204" text-anchor="middle" font-size="13.5" fill="#18313c">신청하면 최대 3년</text><text x="770" y="226" text-anchor="middle" font-size="13.5" fill="#18313c">직장 때 기준으로</text>
<text x="770" y="244" text-anchor="middle" font-size="12" fill="#71868d">전액 본인 부담</text>

<rect x="60" y="284" width="760" height="62" rx="8" fill="#f6f9f7"/>
<text x="82" y="310" font-size="13.5" font-weight="700" fill="#102d3c">보험료는 퇴직 전 12개월 보수월액 평균으로 계산합니다. 지역보험료보다 쌀 때만 이득입니다.</text>
<text x="82" y="332" font-size="13" fill="#3d5560">첫 납부 후 두 달치를 안 내면 자격이 사라집니다. 신청보다 유지가 더 자주 무너집니다.</text>
</g></svg>

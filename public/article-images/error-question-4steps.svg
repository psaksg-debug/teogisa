<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="오류를 요약해서 묻는 방식과 원문을 그대로 붙여 네 가지를 함께 주는 방식을 비교한 도표" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>오류를 물어보는 네 단계</title><rect width="880" height="360" fill="#f6f9f7"/>
<g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<rect x="40" y="26" width="800" height="72" rx="8" fill="#ffffff" stroke="#cddbd6" stroke-width="2"/>
<text x="62" y="54" font-size="14" font-weight="800" fill="#71868d">이렇게 물으면 AI도 추측만 합니다</text>
<text x="62" y="82" font-size="15" fill="#3d5560">&#8220;에러 나는데 왜 그래요?&#8221; &#183; &#8220;빨간 글씨 떠요&#8221; &#183; &#8220;안 돼요&#8221;</text>

<text x="62" y="136" font-size="15" font-weight="800" fill="#102d3c">네 가지를 한 번에 붙이면 대부분 한 번에 잡힙니다</text>

<rect x="40" y="152" width="196" height="112" rx="8" fill="#2e6573"/>
<text x="138" y="182" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">① 에러 원문</text>
<text x="138" y="208" text-anchor="middle" font-size="12.5" fill="#d8eee8">요약하지 말고</text>
<text x="138" y="228" text-anchor="middle" font-size="12.5" fill="#d8eee8">통째로 복사</text>
<text x="138" y="250" text-anchor="middle" font-size="12" fill="#a9d3cb">여기에 답이 있습니다</text>

<rect x="244" y="152" width="196" height="112" rx="8" fill="#ffffff" stroke="#cddbd6" stroke-width="2"/>
<text x="342" y="182" text-anchor="middle" font-size="14" font-weight="800" fill="#102d3c">② 직전에 한 일</text>
<text x="342" y="208" text-anchor="middle" font-size="12.5" fill="#18313c">어제까지 됐는데</text>
<text x="342" y="228" text-anchor="middle" font-size="12.5" fill="#18313c">무엇을 바꿨나</text>

<rect x="448" y="152" width="196" height="112" rx="8" fill="#ffffff" stroke="#cddbd6" stroke-width="2"/>
<text x="546" y="182" text-anchor="middle" font-size="14" font-weight="800" fill="#102d3c">③ 기대한 동작</text>
<text x="546" y="208" text-anchor="middle" font-size="12.5" fill="#18313c">원래 어떻게</text>
<text x="546" y="228" text-anchor="middle" font-size="12.5" fill="#18313c">되어야 하는가</text>

<rect x="652" y="152" width="188" height="112" rx="8" fill="#ffffff" stroke="#cddbd6" stroke-width="2"/>
<text x="746" y="182" text-anchor="middle" font-size="14" font-weight="800" fill="#102d3c">④ 환경</text>
<text x="746" y="208" text-anchor="middle" font-size="12.5" fill="#18313c">어떤 도구, 어디서</text>
<text x="746" y="228" text-anchor="middle" font-size="12.5" fill="#18313c">돌렸는가</text>

<rect x="40" y="282" width="800" height="54" rx="8" fill="#fff7f0" stroke="#e67b32" stroke-width="2"/>
<text x="62" y="314" font-size="14" font-weight="700" fill="#b45309">같은 자리에서 세 번 막히면 질문을 더 하지 말고, 되돌린 뒤 다른 방법으로 갑니다.</text>
</g></svg>

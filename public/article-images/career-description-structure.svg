<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="경력을 나열식으로 쓴 문장과 상황 역할 행동 결과 순으로 쓴 문장을 비교한 도표" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>경력기술서 한 항목 쓰는 구조</title><rect width="880" height="380" fill="#ffffff"/>
<g font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<rect x="40" y="26" width="800" height="86" rx="8" fill="#f6f9f7" stroke="#cddbd6" stroke-width="2"/>
<text x="62" y="54" font-size="14" font-weight="800" fill="#71868d">흔한 문장 &#183; 읽는 사람이 판단할 근거가 없습니다</text>
<text x="62" y="84" font-size="15" fill="#3d5560">&#8220;생산관리 업무 총괄, 품질 개선 및 원가 절감 활동 수행&#8221;</text>
<text x="62" y="102" font-size="12.5" fill="#9aaba9">무엇을 맡았는지는 있는데, 무엇을 했고 어떻게 됐는지가 없습니다.</text>

<text x="62" y="150" font-size="15" font-weight="800" fill="#102d3c">네 칸으로 나눠 쓰면 같은 경력이 근거가 됩니다</text>

<rect x="40" y="164" width="196" height="94" rx="8" fill="#eaf2ee"/>
<text x="138" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#2e6573">① 상황</text>
<text x="138" y="218" text-anchor="middle" font-size="12.5" fill="#18313c">어떤 문제가</text>
<text x="138" y="238" text-anchor="middle" font-size="12.5" fill="#18313c">있었는가</text>

<rect x="244" y="164" width="196" height="94" rx="8" fill="#eaf2ee"/>
<text x="342" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#2e6573">② 내 역할</text>
<text x="342" y="218" text-anchor="middle" font-size="12.5" fill="#18313c">팀이 아니라</text>
<text x="342" y="238" text-anchor="middle" font-size="12.5" fill="#18313c">내가 맡은 부분</text>

<rect x="448" y="164" width="196" height="94" rx="8" fill="#eaf2ee"/>
<text x="546" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#2e6573">③ 한 일</text>
<text x="546" y="218" text-anchor="middle" font-size="12.5" fill="#18313c">구체적인 행동</text>
<text x="546" y="238" text-anchor="middle" font-size="12.5" fill="#18313c">한두 가지만</text>

<rect x="652" y="164" width="188" height="94" rx="8" fill="#e67b32"/>
<text x="746" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">④ 결과</text>
<text x="746" y="218" text-anchor="middle" font-size="12.5" fill="#fdece0">숫자나 상태 변화</text>
<text x="746" y="238" text-anchor="middle" font-size="12.5" fill="#fdece0">여기가 비면 무효</text>

<rect x="40" y="276" width="800" height="76" rx="8" fill="#fff7f0" stroke="#e67b32" stroke-width="2"/>
<text x="62" y="304" font-size="14" font-weight="800" fill="#b45309">고쳐 쓴 문장</text>
<text x="62" y="332" font-size="14.5" fill="#18313c">&#8220;불량률이 높던 라인에서 검사 공정을 맡아, 작업 순서를 바꾸고 점검표를 새로 만들어 불량을 절반으로 줄였습니다&#8221;</text>
</g></svg>
